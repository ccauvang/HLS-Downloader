<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>HLS Downloader — History</title>
    <link rel="stylesheet" href="history.css" />
</head>

<body>
    <div id="body">
        <span id="header-sub">History</span>
        <div id="history-view">
            <div id="search-wrap">
                <svg id="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M20 20l-3.5-3.5" />
                </svg>
                <input type="text" id="search" placeholder="Search filename or URL…" />
            </div>
            <div id="list-head">
                <div id="count"></div>
                <button id="clear-all-btn" title="Clear all history">🗑 Clear All</button>
            </div>
            <div id="list"></div>
            <div id="empty">No downloads yet.</div>
        </div>
    </div>
    <script src="history.js"></script>
</body>

</html>
